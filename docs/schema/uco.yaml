    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - action_object
    - environment
    - instrument
    - location
    - participant
    - performer
    - result
    - subaction
    - actionCount
    - actionStatus
    - action_endTime
    - action_startTime
    - error
    - ActionLifecycle_phase
    slot_usage:
      phase:
        name: phase
        maximum_cardinality: 1
    class_uri: uco-action:ActionLifecycle
    none_of:
    - slot_conditions:
        actionCount:
          name: actionCount
          value_presence: PRESENT
    - slot_conditions:
        actionStatus:
          name: actionStatus
          value_presence: PRESENT
    - slot_conditions:
        action_endTime:
          name: action_endTime
          value_presence: PRESENT
    - slot_conditions:
        action_startTime:
          name: action_startTime
          value_presence: PRESENT
    - slot_conditions:
        error:
          name: error
          value_presence: PRESENT
  ActionPattern:
