default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  uco_base64_binary:
    name: uco_base64_binary
    definition_uri: https://w3id.org/lmodel/uco/UcoBase64Binary
    description: 'XSD''s base64Binary: binary data in the Base64 alphabet, padded
      with =.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: string
    base: str
    uri: xsd:base64Binary
    pattern: ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
  uco_byte:
    name: uco_byte
    definition_uri: https://w3id.org/lmodel/uco/UcoByte
    description: 'XSD''s byte: an integer from -128 to 127.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: integer
    base: int
    uri: xsd:byte
    minimum_value: -128
    maximum_value: 127
  uco_duration:
    name: uco_duration
    definition_uri: https://w3id.org/lmodel/uco/UcoDuration
    description: 'XSD''s duration: a length of time such as P1DT2H, in ISO 8601''s
      form.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: string
    base: str
    uri: xsd:duration
    pattern: ^-?P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(?!$)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
  uco_hex_binary:
    name: uco_hex_binary
    definition_uri: https://w3id.org/lmodel/uco/UcoHexBinary
    description: 'XSD''s hexBinary: binary data as pairs of hexadecimal digits.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: string
    base: str
    uri: xsd:hexBinary
    pattern: ^([0-9a-fA-F]{2})*$
  uco_non_negative_integer:
    name: uco_non_negative_integer
    definition_uri: https://w3id.org/lmodel/uco/UcoNonNegativeInteger
    description: 'XSD''s nonNegativeInteger: an integer of zero or more.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: integer
    base: int
    uri: xsd:nonNegativeInteger
    minimum_value: 0
  uco_positive_integer:
    name: uco_positive_integer
    definition_uri: https://w3id.org/lmodel/uco/UcoPositiveInteger
    description: 'XSD''s positiveInteger: an integer of one or more.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: integer
    base: int
    uri: xsd:positiveInteger
    minimum_value: 1
  uco_unsigned_int:
    name: uco_unsigned_int
    definition_uri: https://w3id.org/lmodel/uco/UcoUnsignedInt
    description: 'XSD''s unsignedInt: an integer from 0 to 4294967295.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: integer
    base: int
    uri: xsd:unsignedInt
    minimum_value: 0
    maximum_value: 4294967295
  uco_unsigned_short:
    name: uco_unsigned_short
    definition_uri: https://w3id.org/lmodel/uco/UcoUnsignedShort
    description: 'XSD''s unsignedShort: an integer from 0 to 65535.'
    from_schema: https://w3id.org/lmodel/uco-core
    typeof: integer
    base: int
    uri: xsd:unsignedShort
    minimum_value: 0
    maximum_value: 65535
  Time:
    name: Time
    definition_uri: https://w3id.org/lmodel/uco/Time
    description: UCO 1.5.0 declares the datatype uco-time:Time without a definition.
    from_schema: https://w3id.org/lmodel/uco-time
    typeof: string
    base: str
    uri: uco-time:Time
  TimeRange:
    name: TimeRange
    definition_uri: https://w3id.org/lmodel/uco/TimeRange
    description: UCO 1.5.0 declares the datatype uco-time:TimeRange without a definition.
    from_schema: https://w3id.org/lmodel/uco-time
    typeof: string
    base: str
    uri: uco-time:TimeRange
  Timestamp:
    name: Timestamp
    definition_uri: https://w3id.org/lmodel/uco/Timestamp
    description: UCO 1.5.0 declares the datatype uco-time:Timestamp without a definition.
    from_schema: https://w3id.org/lmodel/uco-time
    typeof: string
    base: str
    uri: uco-time:Timestamp
  Identifier:
    name: Identifier
    definition_uri: https://w3id.org/lmodel/uco/Identifier
    description: An identifier is a string conformant to the specified UUID-based
      format for UCO object identifiers.
    from_schema: https://w3id.org/lmodel/uco-types
    typeof: string
    base: str
    uri: uco-types:Identifier
  NativeFormatString:
    name: NativeFormatString
    definition_uri: https://w3id.org/lmodel/uco/NativeFormatString
    description: Specifies data in its native format of some external language. The
      data may be encoded in Base64 per [RFC4648]. Data encoded in Base64 must be
      denoted as such using the encoded property.
    from_schema: https://w3id.org/lmodel/uco-types
    typeof: string
    base: str
    uri: uco-types:NativeFormatString
  StructuredText:
    name: StructuredText
    definition_uri: https://w3id.org/lmodel/uco/StructuredText
    description: Expresses string-based data in some information structuring format
      (e.g., HTML5).
    from_schema: https://w3id.org/lmodel/uco-types
    typeof: string
    base: str
    uri: uco-types:StructuredText
