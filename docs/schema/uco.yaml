  IdentityFacet:
    name: IdentityFacet
    definition_uri: https://w3id.org/lmodel/uco/IdentityFacet
    description: An identity facet is a grouping of characteristics unique to a particular
      aspect of an identity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:IdentityFacet
    is_a: Facet
    slots:
    - type
    class_uri: uco-identity:IdentityFacet
  LanguagesFacet:
    name: LanguagesFacet
    definition_uri: https://w3id.org/lmodel/uco/LanguagesFacet
    description: Languages is a grouping of characteristics unique to specific syntactically
      and grammatically standardized forms of communication (human or computer) in
      which an entity has proficiency (comprehends, speaks, reads, or writes).
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:LanguagesFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:LanguagesFacet
  NationalityFacet:
    name: NationalityFacet
    definition_uri: https://w3id.org/lmodel/uco/NationalityFacet
    description: Nationality is a grouping of characteristics unique to the condition
      of an entity belonging to a particular nation.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:NationalityFacet
    is_a: IdentityFacet
    slots:
