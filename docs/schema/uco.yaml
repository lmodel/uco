  Identity:
    name: Identity
    definition_uri: https://w3id.org/lmodel/uco/Identity
    description: An identity is a grouping of identifying characteristics unique to
      an individual or organization.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
