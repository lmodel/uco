  ControlledDictionary:
    name: ControlledDictionary
    definition_uri: https://w3id.org/lmodel/uco/ControlledDictionary
    description: A controlled dictionary is a list of (term/key, value) pairs where
      each term/key exists no more than once and is constrained to an explicitly defined
      set of values.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:ControlledDictionary
    is_a: Dictionary
    slots:
    - type
    - ControlledDictionary_entry
    slot_usage:
      entry:
        name: entry
        range: ControlledDictionaryEntry
    class_uri: uco-types:ControlledDictionary
  ControlledDictionaryEntry:
    name: ControlledDictionaryEntry
    definition_uri: https://w3id.org/lmodel/uco/ControlledDictionaryEntry
    description: A controlled dictionary entry is a single (term/key, value) pair
      where the term/key is constrained to an explicitly defined set of values.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:ControlledDictionaryEntry
    is_a: DictionaryEntry
    slots:
    - type
    - key
    - types_value
    class_uri: uco-types:ControlledDictionaryEntry
  Hash:
    name: Hash
    definition_uri: https://w3id.org/lmodel/uco/Hash
    description: A hash is a grouping of characteristics unique to the result of applying
      a mathematical algorithm that maps data of arbitrary size to a bit string (the
      'hash') and is a one-way function, that is, a function which is practically
      infeasible to invert. This is commonly used for integrity checking of data.
      [based on https://en.wikipedia.org/wiki/Cryptographic_hash_function]
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:Hash
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - hashMethod
    - hashValue
    class_uri: uco-types:Hash
  ImproperDictionary:
    name: ImproperDictionary
    definition_uri: https://w3id.org/lmodel/uco/ImproperDictionary
    description: UCO 1.5.0 declares the class uco-types:ImproperDictionary without
      a definition.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:ImproperDictionary
    is_a: Dictionary
    slots:
    - type
    - entry
    - repeatsKey
    class_uri: uco-types:ImproperDictionary
    disjoint_with:
    - ProperDictionary
  ProperDictionary:
    name: ProperDictionary
    definition_uri: https://w3id.org/lmodel/uco/ProperDictionary
    description: A proper dictionary is list of (term/key, value) pairs with each
      term/key existing no more than once.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
