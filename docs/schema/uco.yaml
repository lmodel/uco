classes:
  UcoDocument:
    name: UcoDocument
    definition_uri: https://w3id.org/lmodel/uco/UcoDocument
    description: A document of UCO data, as a JSON-LD file of UCO holds one graph.
    from_schema: https://w3id.org/lmodel/uco
    exact_mappings:
    - uco_linkml:UcoDocument
    slots:
    - graph
    class_uri: uco_linkml:UcoDocument
    tree_root: true
  Bag:
    name: Bag
    definition_uri: https://w3id.org/lmodel/uco/Bag
    description: A collection that may hold one element more than once, in no order.
    from_schema: https://w3id.org/lmodel/uco-co
    exact_mappings:
    - coll:Bag
    slots:
    - co_size
    - element
    class_uri: coll:Bag
  CoItem:
    name: CoItem
    definition_uri: https://w3id.org/lmodel/uco/CoItem
    description: An entry of a collection, which wraps one element of the collection's
      content.
    from_schema: https://w3id.org/lmodel/uco-co
    exact_mappings:
    - coll:Item
    slots:
    - itemContent
    class_uri: coll:Item
  List:
    name: List
    definition_uri: https://w3id.org/lmodel/uco/List
    description: A collection whose items come in order, one after another.
    from_schema: https://w3id.org/lmodel/uco-co
    exact_mappings:
    - coll:List
    is_a: Bag
    slots:
    - co_size
    - element
    - firstItem
    - List_item
    - lastItem
    slot_usage:
      item:
        name: item
        range: ListItem
        inlined: true
        inlined_as_list: true
    class_uri: coll:List
  ListItem:
    name: ListItem
    definition_uri: https://w3id.org/lmodel/uco/ListItem
    description: An item of a list, which has a place in the list's order.
    from_schema: https://w3id.org/lmodel/uco-co
    exact_mappings:
    - coll:ListItem
    is_a: CoItem
    slots:
    - itemContent
    - followedBy
    - index
    class_uri: coll:ListItem
  Annotation:
    name: Annotation
    definition_uri: https://w3id.org/lmodel/uco/Annotation
    description: An annotation is an assertion made in relation to one or more objects.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Annotation
    is_a: Assertion
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - statement
    - Annotation_object
    slot_usage:
      object:
        name: object
        required: true
    class_uri: uco-core:Annotation
  Assertion:
    name: Assertion
    definition_uri: https://w3id.org/lmodel/uco/Assertion
    description: An assertion is a statement declared to be true.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Assertion
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - statement
    class_uri: uco-core:Assertion
  AttributedName:
    name: AttributedName
    definition_uri: https://w3id.org/lmodel/uco/AttributedName
    description: An attributed name is a name of an entity issued by some attributed
      naming authority.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:AttributedName
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - namingAuthority
    class_uri: uco-core:AttributedName
  Bundle:
    name: Bundle
    definition_uri: https://w3id.org/lmodel/uco/Bundle
    description: A bundle is a container for a grouping of UCO content with no presumption
      of shared context.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Bundle
    is_a: EnclosingCompilation
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - EnclosingCompilation_object
    class_uri: uco-core:Bundle
  Compilation:
    name: Compilation
    definition_uri: https://w3id.org/lmodel/uco/Compilation
    description: A compilation is a grouping of things.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Compilation
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:Compilation
  ConfidenceFacet:
    name: ConfidenceFacet
    definition_uri: https://w3id.org/lmodel/uco/ConfidenceFacet
    description: A confidence is a grouping of characteristics unique to an asserted
      level of certainty in the accuracy of some information.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:ConfidenceFacet
    is_a: Facet
    slots:
    - type
    - confidence
    class_uri: uco-core:ConfidenceFacet
  ContextualCompilation:
    name: ContextualCompilation
    definition_uri: https://w3id.org/lmodel/uco/ContextualCompilation
    description: A contextual compilation is a grouping of things sharing some context
      (e.g., a set of network connections observed on a given day, all accounts associated
      with a given person).
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:ContextualCompilation
    is_a: Compilation
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - object
    class_uri: uco-core:ContextualCompilation
  ControlledVocabulary:
    name: ControlledVocabulary
    definition_uri: https://w3id.org/lmodel/uco/ControlledVocabulary
    description: A controlled vocabulary is an explicitly constrained set of string
      values.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:ControlledVocabulary
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - constrainingVocabularyName
    - constrainingVocabularyReference
    - value
    class_uri: uco-core:ControlledVocabulary
  Dictionary:
    name: Dictionary
    definition_uri: https://w3id.org/lmodel/uco/Dictionary
    description: A dictionary is list of (term/key, value) pairs with each term/key
      having an expectation to exist no more than once. types:Dictionary alone does
      not validate this expectation, but validation is available. For use cases where
      this expectation must be validated, the subclass types:ProperDictionary should
      be used instead of types:Dictionary. For instances where this expectation has
      been found to be violated, the subclass types:ImproperDictionary should be used
      instead of types:Dictionary.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-types:Dictionary
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - entry
    class_uri: uco-types:Dictionary
  DictionaryEntry:
    name: DictionaryEntry
    definition_uri: https://w3id.org/lmodel/uco/DictionaryEntry
    description: A dictionary entry is a single (term/key, value) pair.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-types:DictionaryEntry
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - key
    - types_value
    class_uri: uco-types:DictionaryEntry
  EnclosingCompilation:
    name: EnclosingCompilation
    definition_uri: https://w3id.org/lmodel/uco/EnclosingCompilation
    description: An enclosing compilation is a container for a grouping of things.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:EnclosingCompilation
    is_a: Compilation
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - EnclosingCompilation_object
    slot_usage:
      object:
        name: object
        required: true
    class_uri: uco-core:EnclosingCompilation
  Event:
    name: Event
    definition_uri: https://w3id.org/lmodel/uco/Event
    description: An Event is a noteworthy occurrence (something that happens or might
      happen).
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Event
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - endTime
    - eventAttribute
    - eventContext
    - eventType
    - startTime
    class_uri: uco-core:Event
  ExternalReference:
    name: ExternalReference
    definition_uri: https://w3id.org/lmodel/uco/ExternalReference
    description: Characteristics of a reference to a resource outside of the UCO.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:ExternalReference
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - definingContext
    - externalIdentifier
    - referenceURL
    class_uri: uco-core:ExternalReference
  Facet:
    name: Facet
    definition_uri: https://w3id.org/lmodel/uco/Facet
    description: A facet is a grouping of characteristics singularly unique to a particular
      inherent aspect of a UCO domain object.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Facet
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    class_uri: uco-core:Facet
  Grouping:
    name: Grouping
    definition_uri: https://w3id.org/lmodel/uco/Grouping
    description: A grouping is a compilation of referenced UCO content with a shared
      context.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Grouping
    is_a: ContextualCompilation
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - object
    - context
    class_uri: uco-core:Grouping
  IdentityAbstraction:
    name: IdentityAbstraction
    definition_uri: https://w3id.org/lmodel/uco/IdentityAbstraction
    description: An identity abstraction is a grouping of identifying characteristics
      unique to an individual or organization. This class is an ontological structural
      abstraction for this concept. Implementations of this concept should utilize
      the identity:Identity class.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:IdentityAbstraction
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:IdentityAbstraction
  Item:
    name: Item
    definition_uri: https://w3id.org/lmodel/uco/Item
    description: An item is a distinct article or unit.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Item
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:Item
  MarkingDefinitionAbstraction:
    name: MarkingDefinitionAbstraction
    definition_uri: https://w3id.org/lmodel/uco/MarkingDefinitionAbstraction
    description: A marking definition abstraction is a grouping of characteristics
      unique to the expression of a specific data marking conveying restrictions,
      permissions, and other guidance for how marked data can be used and shared.
      This class is an ontological structural abstraction for this concept. Implementations
      of this concept should utilize the marking:MarkingDefinition class.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:MarkingDefinitionAbstraction
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:MarkingDefinitionAbstraction
  ModusOperandi:
    name: ModusOperandi
    definition_uri: https://w3id.org/lmodel/uco/ModusOperandi
    description: A modus operandi is a particular method of operation (how a particular
      entity behaves or the resources they use).
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:ModusOperandi
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:ModusOperandi
  Relationship:
    name: Relationship
    definition_uri: https://w3id.org/lmodel/uco/Relationship
    description: A relationship is a grouping of characteristics unique to an assertion
      that one or more objects are related to another object in some way.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:Relationship
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - endTime
    - isDirectional
    - kindOfRelationship
    - source
    - startTime
    - target
    class_uri: uco-core:Relationship
  UcoInherentCharacterizationThing:
    name: UcoInherentCharacterizationThing
    definition_uri: https://w3id.org/lmodel/uco/UcoInherentCharacterizationThing
    description: A UCO inherent characterization thing is a grouping of characteristics
      unique to a particular inherent aspect of a UCO domain object.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:UcoInherentCharacterizationThing
    is_a: UcoThing
    slots:
    - type
    class_uri: uco-core:UcoInherentCharacterizationThing
    disjoint_with:
    - UcoObject
  UcoObject:
    name: UcoObject
    definition_uri: https://w3id.org/lmodel/uco/UcoObject
    description: A UCO object is a representation of a fundamental concept either
      directly inherent to the cyber domain or indirectly related to the cyber domain
      and necessary for contextually characterizing cyber domain concepts and relationships.
      Within the Unified Cyber Ontology (UCO) structure this is the base class acting
      as a consistent, unifying and interoperable foundation for all explicit and
      inter-relatable content objects.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:UcoObject
    is_a: UcoThing
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-core:UcoObject
    disjoint_with:
    - UcoInherentCharacterizationThing
  UcoThing:
    name: UcoThing
    definition_uri: https://w3id.org/lmodel/uco/UcoThing
    description: UcoThing is the top-level class for individuals within UCO.
    from_schema: https://w3id.org/lmodel/uco-core
    see_also:
    - uco-core:UcoThing-identifier-regex-shape
    exact_mappings:
    - uco-core:UcoThing
    slots:
    - type
    class_uri: uco-core:UcoThing
  UcoType:
    name: UcoType
    definition_uri: https://w3id.org/lmodel/uco/UcoType
    description: UcoType is the top-level class for metaclasses within UCO. An instance
      of core:UcoType is also an instance of owl:Class, and is or specializes core:UcoThing.
    from_schema: https://w3id.org/lmodel/uco-core
    exact_mappings:
    - uco-core:UcoType
    slots:
    - id
    - type
    class_uri: uco-core:UcoType
    disjoint_with:
    - UcoThing
  Configuration:
    name: Configuration
    definition_uri: https://w3id.org/lmodel/uco/Configuration
    description: A configuration is a grouping of characteristics unique to a set
      of parameters or initial settings for the use of a tool, application, software,
      or other cyber object.
    from_schema: https://w3id.org/lmodel/uco-configuration
    see_also:
    - https://github.com/ucoProject/UCO/issues/432
    exact_mappings:
    - uco-configuration:Configuration
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - configurationEntry
    - dependencies
    - usageContextAssumptions
    class_uri: uco-configuration:Configuration
  ConfigurationEntry:
    name: ConfigurationEntry
    definition_uri: https://w3id.org/lmodel/uco/ConfigurationEntry
    description: A configuration entry is a grouping of characteristics unique to
      a particular parameter or initial setting for the use of a tool, application,
      software, or other cyber object.
    from_schema: https://w3id.org/lmodel/uco-configuration
    exact_mappings:
    - uco-configuration:ConfigurationEntry
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - itemDescription
    - itemName
    - itemObject
    - itemType
    - itemValue
    class_uri: uco-configuration:ConfigurationEntry
  Dependency:
    name: Dependency
    definition_uri: https://w3id.org/lmodel/uco/Dependency
    description: A dependency is a grouping of characteristics unique to something
      that a tool or other software relies on to function as intended.
    from_schema: https://w3id.org/lmodel/uco-configuration
    exact_mappings:
    - uco-configuration:Dependency
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - dependencyDescription
    - dependencyType
    class_uri: uco-configuration:Dependency
  GPSCoordinatesFacet:
    name: GPSCoordinatesFacet
    definition_uri: https://w3id.org/lmodel/uco/GPSCoordinatesFacet
    description: A GPS coordinates facet is a grouping of characteristics unique to
      the expression of quantified dilution of precision (DOP) for an asserted set
      of geolocation coordinates typically associated with satellite navigation such
      as the Global Positioning System (GPS).
    from_schema: https://w3id.org/lmodel/uco-location
    exact_mappings:
