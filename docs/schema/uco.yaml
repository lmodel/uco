    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - hasChanged
    - state
    class_uri: uco-observable:ARPCacheEntry
  Account:
