    class_uri: uco-analysis:ArtifactClassificationResultFacet
  API:
    name: API
    definition_uri: https://w3id.org/lmodel/uco/API
    description: An API (application programming interface) is a computing interface
      that defines interactions between multiple software or mixed hardware-software
      intermediaries. It defines the kinds of calls or requests that can be made,
      how to make them, the data formats that should be used, the conventions to follow,
      etc. [based on https://en.wikipedia.org/wiki/API]
    from_schema: https://w3id.org/lmodel/uco-observable
    exact_mappings:
    - uco-observable:API
    is_a: ObservableObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - hasChanged
    - state
    class_uri: uco-observable:API
  ARPCache:
    name: ARPCache
    definition_uri: https://w3id.org/lmodel/uco/ARPCache
    description: An ARP cache is a collection of Address Resolution Protocol (ARP)
      entries (mostly dynamic) that are created when an IP address is resolved to
      a MAC address (so the computer can effectively communicate with the IP address).
      [based on https://en.wikipedia.org/wiki/ARP_cache]
    from_schema: https://w3id.org/lmodel/uco-observable
    exact_mappings:
    - uco-observable:ARPCache
    is_a: ObservableObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
