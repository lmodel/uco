    definition_uri: https://w3id.org/lmodel/uco/WindowsEvent
    description: A Windows event is a notification record of an occurance of interest
      (system, security, application, etc.) on a Windows operating system.
    from_schema: https://w3id.org/lmodel/uco-observable
