  LatLongCoordinatesFacet:
    name: LatLongCoordinatesFacet
    definition_uri: https://w3id.org/lmodel/uco/LatLongCoordinatesFacet
    description: A lat long coordinates facet is a grouping of characteristics unique
      to the expression of a geolocation as the intersection of specific latitude,
      longitude, and altitude values.
    from_schema: https://w3id.org/lmodel/uco-location
    exact_mappings:
    - uco-location:LatLongCoordinatesFacet
    is_a: Facet
    slots:
