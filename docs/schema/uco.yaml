    class_uri: uco-identity:NationalityFacet
  OccupationFacet:
    name: OccupationFacet
    definition_uri: https://w3id.org/lmodel/uco/OccupationFacet
    description: Occupation is a grouping of characteristics unique to the job or
      profession of an entity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:OccupationFacet
