  AnalyticResultFacet:
    name: AnalyticResultFacet
    definition_uri: https://w3id.org/lmodel/uco/AnalyticResultFacet
    description: An analytic result facet is a grouping of characteristics unique
      to the results of an analysis action.
    from_schema: https://w3id.org/lmodel/uco-analysis
