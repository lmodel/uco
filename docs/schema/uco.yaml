    class_uri: uco-role:BenevolentRole
  MaliciousRole:
    name: MaliciousRole
    definition_uri: https://w3id.org/lmodel/uco/MaliciousRole
    description: A malicious role is a role with malevolent intent.
    from_schema: https://w3id.org/lmodel/uco-role
    exact_mappings:
    - uco-role:MaliciousRole
    is_a: Role
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-role:MaliciousRole
  NeutralRole:
    name: NeutralRole
    definition_uri: https://w3id.org/lmodel/uco/NeutralRole
    description: A neutral role is a role with impartial intent.
    from_schema: https://w3id.org/lmodel/uco-role
    exact_mappings:
    - uco-role:NeutralRole
    is_a: Role
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-role:NeutralRole
  Role:
    name: Role
    definition_uri: https://w3id.org/lmodel/uco/Role
    description: A role is a usual or customary function based on contextual perspective.
    from_schema: https://w3id.org/lmodel/uco-role
    exact_mappings:
    - uco-role:Role
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-role:Role
  AnalyticTool:
    name: AnalyticTool
    definition_uri: https://w3id.org/lmodel/uco/AnalyticTool
    description: An analytic tool is an artifact of hardware and/or software utilized
      to accomplish a task or purpose of explanation, interpretation or logical reasoning.
    from_schema: https://w3id.org/lmodel/uco-tool
    exact_mappings:
    - uco-tool:AnalyticTool
    is_a: Tool
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - creator
    - references
    - servicePack
    - toolType
    - version
    class_uri: uco-tool:AnalyticTool
  BuildFacet:
    name: BuildFacet
    definition_uri: https://w3id.org/lmodel/uco/BuildFacet
    description: A build facet is a grouping of characteristics unique to a particular
      version of a software.
    from_schema: https://w3id.org/lmodel/uco-tool
    exact_mappings:
    - uco-tool:BuildFacet
    is_a: Facet
    slots:
    - type
    - buildInformation
    class_uri: uco-tool:BuildFacet
  BuildInformationType:
    name: BuildInformationType
    definition_uri: https://w3id.org/lmodel/uco/BuildInformationType
    description: A build information type is a grouping of characteristics that describe
      how a particular version of software was converted from source code to executable
      code.
    from_schema: https://w3id.org/lmodel/uco-tool
    exact_mappings:
    - uco-tool:BuildInformationType
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - buildConfiguration
    - buildID
    - buildLabel
    - buildOutputLog
    - buildProject
    - buildScript
    - buildUtility
    - buildVersion
    - compilationDate
    - compilers
    - libraries
    class_uri: uco-tool:BuildInformationType
  BuildUtilityType:
    name: BuildUtilityType
    definition_uri: https://w3id.org/lmodel/uco/BuildUtilityType
    description: A build utility type characterizes the tool used to convert from
      source code to executable code for a particular version of software.
    from_schema: https://w3id.org/lmodel/uco-tool
    exact_mappings:
    - uco-tool:BuildUtilityType
    is_a: UcoInherentCharacterizationThing
    slots:
