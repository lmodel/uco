  WindowsFilemapping:
    name: WindowsFilemapping
    definition_uri: https://w3id.org/lmodel/uco/WindowsFilemapping
    description: A Windows file mapping is the association of a file's contents with
      a portion of the virtual address space of a process within a Windows operating
      system. The system creates a file mapping object (also known as a section object)
      to maintain this association. A file view is the portion of virtual address
      space that a process uses to access the file's contents. File mapping allows
      the process to use both random input and output (I/O) and sequential I/O. It
      also allows the process to work efficiently with a large data file, such as
      a database, without having to map the whole file into memory. Multiple processes
      can also use memory-mapped files to share data. Processes read from and write
      to the file view using pointers, just as they would with dynamically allocated
      memory. The use of file mapping improves efficiency because the file resides
      on disk, but the file view resides in memory.[based on https://docs.microsoft.com/en-us/windows/win32/memory/file-mapping]
    from_schema: https://w3id.org/lmodel/uco-observable
    exact_mappings:
    - uco-observable:WindowsFilemapping
    is_a: ObservableObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - hasChanged
    - state
    class_uri: uco-observable:WindowsFilemapping
  WindowsHandle:
    name: WindowsHandle
    definition_uri: https://w3id.org/lmodel/uco/WindowsHandle
    description: A Windows handle is an abstract reference to a resource within the
      Windows operating system, such as a window, memory, an open file or a pipe.
      It is the mechanism by which applications interact with such resources in the
      Windows operating system.
    from_schema: https://w3id.org/lmodel/uco-observable
