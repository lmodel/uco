    - cpeid
    - swid
    class_uri: uco-tool:CompilerType
  ConfiguredTool:
    name: ConfiguredTool
    definition_uri: https://w3id.org/lmodel/uco/ConfiguredTool
    description: A ConfiguredTool is a Tool that is known to be configured to run
