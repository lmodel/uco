  Thread:
    name: Thread
    definition_uri: https://w3id.org/lmodel/uco/Thread
    description: A semi-ordered array of items, that can be present in multiple copies.
      Implementation of a UCO Thread is similar to a Collections Ontology List, except
      a Thread may fork and merge - that is, one of its members may have two or more
      direct successors, and two or more direct predecessors.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:Thread
    is_a: UcoThing
    mixins:
    - Bag
    slots:
    - type
    - id
    - Thread_item
    - threadOriginItem
    - threadTerminalItem
    - co_size
    - element
    slot_usage:
      item:
        name: item
        range: ThreadItem
        inlined: false
    class_uri: uco-types:Thread
    disjoint_with:
    - List
  ThreadItem:
    name: ThreadItem
    definition_uri: https://w3id.org/lmodel/uco/ThreadItem
    description: A ThreadItem is a member of a thread.
    from_schema: https://w3id.org/lmodel/uco-types
    exact_mappings:
    - uco-types:ThreadItem
    is_a: UcoThing
    mixins:
    - CoItem
    slots:
    - type
    - id
    - ThreadItem_itemContent
    - threadNextItem
    - threadPredecessor
    - threadPreviousItem
    - threadSuccessor
    slot_usage:
      itemContent:
        name: itemContent
        range: UcoObject
        inlined: false
    class_uri: uco-types:ThreadItem
    disjoint_with:
    - ListItem
