    - buildUtilityName
    - cpeid
    - swid
    class_uri: uco-tool:BuildUtilityType
  CompilerType:
    name: CompilerType
    definition_uri: https://w3id.org/lmodel/uco/CompilerType
    description: A compiler type is a grouping of characteristics unique to a specific
      program that translates computer code written in one programming language (the
      source language) into another language (the target language). Typically a program
      that translates source code from a high-level programming language to a lower-level
      language (e.g., assembly language, object code, or machine code) to create an
      executable program. [based on https://en.wikipedia.org/wiki/Compiler]
    from_schema: https://w3id.org/lmodel/uco-tool
    exact_mappings:
    - uco-tool:CompilerType
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
