  Organization:
    name: Organization
    definition_uri: https://w3id.org/lmodel/uco/Organization
    description: An organization is a grouping of identifying characteristics unique
      to a group of people who work together in an organized way for a shared purpose.
      [based on https://dictionary.cambridge.org/us/dictionary/english/organization]
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
