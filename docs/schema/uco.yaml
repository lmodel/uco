  ArtifactClassification:
    name: ArtifactClassification
    definition_uri: https://w3id.org/lmodel/uco/ArtifactClassification
    description: An artifact classification is a single specific assertion that a
      particular class of a classification taxonomy applies to something.
    from_schema: https://w3id.org/lmodel/uco-analysis
