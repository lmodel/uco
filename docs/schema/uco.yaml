  CountryOfResidenceFacet:
    name: CountryOfResidenceFacet
    definition_uri: https://w3id.org/lmodel/uco/CountryOfResidenceFacet
    description: Country of residence is a grouping of characteristics unique to information
      related to the country, or countries, where an entity resides.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
