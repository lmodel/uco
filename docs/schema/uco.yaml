  ActionLifecycle:
    name: ActionLifecycle
    definition_uri: https://w3id.org/lmodel/uco/ActionLifecycle
    description: An action lifecycle is an action pattern consisting of an ordered
      set of multiple actions or subordinate action lifecycles.
    from_schema: https://w3id.org/lmodel/uco-action
    exact_mappings:
    - uco-action:ActionLifecycle
    is_a: Action
    slots:
