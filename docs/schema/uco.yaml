  ActionFrequencyFacet:
    name: ActionFrequencyFacet
    definition_uri: https://w3id.org/lmodel/uco/ActionFrequencyFacet
    description: An action frequency facet is a grouping of characteristics unique
      to the frequency of occurrence for an action.
