    slots:
    - type
    class_uri: uco-identity:CountryOfResidenceFacet
  EventsFacet:
    name: EventsFacet
    definition_uri: https://w3id.org/lmodel/uco/EventsFacet
    description: Events is a grouping of characteristics unique to information related
      to specific relevant things that happen in the lifetime of an entity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:EventsFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:EventsFacet
  IdentifierFacet:
    name: IdentifierFacet
    definition_uri: https://w3id.org/lmodel/uco/IdentifierFacet
    description: Identifier is a grouping of characteristics unique to information
      that uniquely and specifically identities an entity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:IdentifierFacet
