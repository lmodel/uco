    is_a: Identity
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-identity:Organization
  OrganizationDetailsFacet:
    name: OrganizationDetailsFacet
    definition_uri: https://w3id.org/lmodel/uco/OrganizationDetailsFacet
    description: Organization details is a grouping of characteristics unique to an
      identity representing an administrative and functional structure.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:OrganizationDetailsFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:OrganizationDetailsFacet
  Person:
    name: Person
    definition_uri: https://w3id.org/lmodel/uco/Person
    description: A person is a grouping of identifying characteristics unique to a
      human being regarded as an individual. [based on https://www.lexico.com/en/definition/person]
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:Person
    is_a: Identity
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-identity:Person
  PersonalDetailsFacet:
    name: PersonalDetailsFacet
    definition_uri: https://w3id.org/lmodel/uco/PersonalDetailsFacet
    description: Personal details is a grouping of characteristics unique to an identity
      representing an individual person.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:PersonalDetailsFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:PersonalDetailsFacet
  PhysicalInfoFacet:
    name: PhysicalInfoFacet
    definition_uri: https://w3id.org/lmodel/uco/PhysicalInfoFacet
    description: Physical info is a grouping of characteristics unique to the outwardly
      observable nature of an individual person.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:PhysicalInfoFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:PhysicalInfoFacet
  QualificationFacet:
    name: QualificationFacet
    definition_uri: https://w3id.org/lmodel/uco/QualificationFacet
    description: Qualification is a grouping of characteristics unique to particular
      skills, capabilities or their related achievements (educational, professional,
      etc.) of an entity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:QualificationFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:QualificationFacet
  RelatedIdentityFacet:
    name: RelatedIdentityFacet
    definition_uri: https://w3id.org/lmodel/uco/RelatedIdentityFacet
    description: <Needs fleshed out from CIQ>
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:RelatedIdentityFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:RelatedIdentityFacet
  SimpleNameFacet:
    name: SimpleNameFacet
    definition_uri: https://w3id.org/lmodel/uco/SimpleNameFacet
    description: A simple name facet is a grouping of characteristics unique to the
      personal name (e.g., Dr. John Smith Jr.) held by an identity.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:SimpleNameFacet
    is_a: IdentityFacet
    slots:
    - type
    - familyName
    - givenName
    - honorificPrefix
    - honorificSuffix
    class_uri: uco-identity:SimpleNameFacet
  VisaFacet:
    name: VisaFacet
    definition_uri: https://w3id.org/lmodel/uco/VisaFacet
    description: Visa is a grouping of characteristics unique to information related
      to a person's ability to enter, leave, or stay for a specified period of time
      in a country.
    from_schema: https://w3id.org/lmodel/uco-identity
    exact_mappings:
    - uco-identity:VisaFacet
    is_a: IdentityFacet
    slots:
    - type
    class_uri: uco-identity:VisaFacet
  GranularMarking:
    name: GranularMarking
    definition_uri: https://w3id.org/lmodel/uco/GranularMarking
    description: A granular marking is a grouping of characteristics unique to specification
      of marking definitions (restrictions, permissions, and other guidance for how
      data can be used and shared) that apply to particular portions of a particular
      UCO object.
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:GranularMarking
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    - contentSelectors
    - marking
    class_uri: uco-marking:GranularMarking
  LicenseMarking:
    name: LicenseMarking
    definition_uri: https://w3id.org/lmodel/uco/LicenseMarking
    description: A license marking is a grouping of characteristics unique to the
      expression of data marking definitions (restrictions, permissions, and other
      guidance for how data can be used and shared) to convey details of license restrictions
      that apply to the data.
    title: License Marking
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:LicenseMarking
    is_a: MarkingModel
    slots:
    - type
    - LicenseMarking_definitionType
    - license
    slot_usage:
      definitionType:
        name: definitionType
        multivalued: true
        has_member:
          equals_string: license
    class_uri: uco-marking:LicenseMarking
  MarkingDefinition:
    name: MarkingDefinition
    definition_uri: https://w3id.org/lmodel/uco/MarkingDefinition
    description: A marking definition is a grouping of characteristics unique to the
      expression of a specific data marking conveying restrictions, permissions, and
      other guidance for how marked data can be used and shared.
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:MarkingDefinition
    is_a: MarkingDefinitionAbstraction
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - definition
    - MarkingDefinition_definitionType
    slot_usage:
      definitionType:
        name: definitionType
        required: true
    class_uri: uco-marking:MarkingDefinition
  MarkingModel:
    name: MarkingModel
    definition_uri: https://w3id.org/lmodel/uco/MarkingModel
    description: A marking model is a grouping of characteristics unique to the expression
      of a particular form of data marking definitions (restrictions, permissions,
      and other guidance for how data can be used and shared).
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:MarkingModel
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    class_uri: uco-marking:MarkingModel
  ReleaseToMarking:
    name: ReleaseToMarking
    definition_uri: https://w3id.org/lmodel/uco/ReleaseToMarking
    description: A release-to marking is a grouping of characteristics unique to the
      expression of data marking definitions (restrictions, permissions, and other
      guidance for how data can be used and shared) to convey details of authorized
      persons and/or organizations to which to the associated content may be released.
      The existence of the Release-To marking restricts access to ONLY those identities
      explicitly listed, regardless of whether another data marking exists that allows
      sharing with other members of the community.
    title: Release-To Marking
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:ReleaseToMarking
    is_a: MarkingModel
    slots:
    - type
    - authorizedIdentities
    - ReleaseToMarking_definitionType
    slot_usage:
      definitionType:
        name: definitionType
        multivalued: true
        has_member:
          equals_string: release-to
    class_uri: uco-marking:ReleaseToMarking
  StatementMarking:
    name: StatementMarking
    definition_uri: https://w3id.org/lmodel/uco/StatementMarking
    description: A statement marking is a grouping of characteristics unique to the
      expression of data marking definitions (restrictions, permissions, and other
      guidance for how data can be used and shared) to convey details of a textual
      marking statement, (e.g., copyright) whose semantic meaning should apply to
      the associated content. Statement markings are generally not machine-readable.
      An example of this would be a simple marking to apply copyright information,
      such as 'Copyright 2014 Acme Inc.'.
    title: Statement Marking
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:StatementMarking
    is_a: MarkingModel
    slots:
    - type
    - StatementMarking_definitionType
    - marking_statement
    slot_usage:
      definitionType:
        name: definitionType
        multivalued: true
        has_member:
          equals_string: statement
    class_uri: uco-marking:StatementMarking
  TermsOfUseMarking:
    name: TermsOfUseMarking
    definition_uri: https://w3id.org/lmodel/uco/TermsOfUseMarking
    description: A terms of use marking is a grouping of characteristics unique to
      the expression of data marking definitions (restrictions, permissions, and other
      guidance for how data can be used and shared) to convey details of a textual
      statement specifying the Terms of Use (that is, the conditions under which the
      content may be shared, applied, or otherwise used) of the marked content. An
      example of this would be used to communicate a simple statement, such as 'Acme
      Inc. is not responsible for the content of this file'.
    title: Terms Of Use Marking
    from_schema: https://w3id.org/lmodel/uco-marking
    exact_mappings:
    - uco-marking:TermsOfUseMarking
    is_a: MarkingModel
    slots:
    - type
    - TermsOfUseMarking_definitionType
    - termsOfUse
    slot_usage:
      definitionType:
        name: definitionType
        multivalued: true
        has_member:
          equals_string: terms-of-use
    class_uri: uco-marking:TermsOfUseMarking
  LogicalPattern:
    name: LogicalPattern
    definition_uri: https://w3id.org/lmodel/uco/LogicalPattern
    description: A logical pattern is a grouping of characteristics unique to an informational
      pattern expressed via a structured pattern expression following the rules of
      logic.
    from_schema: https://w3id.org/lmodel/uco-pattern
    exact_mappings:
    - uco-pattern:LogicalPattern
    is_a: Pattern
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    - patternExpression
    class_uri: uco-pattern:LogicalPattern
  Pattern:
    name: Pattern
    definition_uri: https://w3id.org/lmodel/uco/Pattern
    description: A pattern is a combination of properties, acts, tendencies, etc.,
      forming a consistent or characteristic arrangement.
    from_schema: https://w3id.org/lmodel/uco-pattern
    exact_mappings:
    - uco-pattern:Pattern
    is_a: UcoObject
    slots:
    - type
    - id
    - createdBy
    - description
    - externalReference
    - hasFacet
    - modifiedTime
    - name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
    class_uri: uco-pattern:Pattern
  PatternExpression:
    name: PatternExpression
    definition_uri: https://w3id.org/lmodel/uco/PatternExpression
    description: A pattern expression is a grouping of characteristics unique to an
      explicit logical expression defining a pattern (e.g., regular expression, SQL
      Select expression, etc.).
    from_schema: https://w3id.org/lmodel/uco-pattern
    exact_mappings:
    - uco-pattern:PatternExpression
    is_a: UcoInherentCharacterizationThing
    slots:
    - type
    class_uri: uco-pattern:PatternExpression
  BenevolentRole:
    name: BenevolentRole
    definition_uri: https://w3id.org/lmodel/uco/BenevolentRole
    description: A benevolent role is a role with positive and/or beneficial intent.
    from_schema: https://w3id.org/lmodel/uco-role
